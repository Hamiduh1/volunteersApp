<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Refreshing Stripe Setup</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f7f5ef;
        color: #1b2733;
        font-family: Georgia, "Times New Roman", serif;
      }
      main {
        max-width: 480px;
        padding: 32px;
        border: 1px solid #d9d3c4;
        border-radius: 20px;
        background: #fffdf8;
        box-shadow: 0 18px 48px rgba(27, 39, 51, 0.12);
        text-align: center;
      }
      a { color: #12696b; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>Refreshing Stripe Setup</h1>
      <p>We are opening a fresh, secure Stripe Connect setup link in the app.</p>
      <p><a href="volunteersapp://payments/stripe-connect/refresh">Open Payment Methods</a></p>
    </main>
    <script>
      window.location.replace("volunteersapp://payments/stripe-connect/refresh");
    </script>
  </body>
</html>
