# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Keep enough native memory for Kotlin/Compose on 11 GB Windows development machines.
# A 4 GB Gradle heap exhausts native address space during R8/Compose release builds.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Xss512k -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
#MAPS_API_KEY="AIzaSyDBPhAvWtvj_KuRJZwzYLB-fEmIgVkSJy4"
android.enableJetifier =false

# Optional but recommended for performance:
# Parallel transforms can exhaust memory or collide with Windows file locks.
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=false
org.gradle.vfs.watch=false
org.gradle.caching=true
kotlin.daemon.useFallbackStrategy=false

# Keep compiler memory isolated from Gradle. This avoids a Kotlin/Compose compile
# consuming the heap needed later by R8 and resource shrinking in a release AAB.
kotlin.compiler.execution.strategy=out-of-process
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Xss512k

# Gradle 8.14.4 is failing to rewrite the incubating problems HTML report on this
# Windows workspace, so disable it to keep builds from failing after tasks finish.
org.gradle.problems.report=false

# Keep Android Studio model sync single-threaded on this memory-constrained machine.
org.gradle.tooling.parallel=false
